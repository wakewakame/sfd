[workspace]
members = ["pdq", "sfd"]
# edition 2024 に対応する resolver。仮想ワークスペースはメンバーの edition から
# 継承しないので、明示しないと resolver 1 に落ちる。
resolver = "3"

[workspace.package]
# タグと一致させること。リリース時に CI が突き合わせて、食い違えば落ちる。
# --version が嘘をついたまま配布されるのを防ぐため。
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"

# profile はワークスペースルートのものだけが使われるので、ここに置く。
[profile.release]
opt-level = 3
lto = true
