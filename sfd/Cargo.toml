[package]
name = "sfd"
description = "Similar File Detector"
version.workspace = true
edition.workspace = true
license.workspace = true
# crates.io へは公開しない。うっかり cargo publish するのを防ぐのと、
# cargo-about の private.ignore で自分自身をライセンス一覧から外すため。
publish = false

[dependencies]
pdq = { path = "../pdq" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
